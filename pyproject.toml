[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "basilisk-cupy"
version = "0.1.0"
description = "Python/CuPy port of the Basilisk flow solver with swappable numerical layers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
gpu = ["cupy>=13"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["basilisk_cupy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long validation runs (deselected by default; run with -m slow)"]
addopts = "-m 'not slow'"
